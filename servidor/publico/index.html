<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Planificador de equipaje y costos de viaje compartido">
  <meta name="google-signin-client_id" content="798614168486-2f1rh7quro0s2ea52hd6gf9aptotsfp0.apps.googleusercontent.com">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="viajelisto">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>TravelEquality</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #268565;
    }
  </style>
</head>
<body>
  <script>
    (function () {
      var hash = window.location.hash || '';
      var body = hash.charAt(0) === '#' ? hash.substring(1) : hash;
      if (body.indexOf('id_token=') !== -1 || body.indexOf('error=') !== -1) {
        sessionStorage.setItem('viajelisto_google_hash', body);
        history.replaceState(null, '', window.location.pathname + window.location.search);
      }
    })();
    window.viajelistoInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', function (event) {
      event.preventDefault();
      window.viajelistoInstallPrompt = event;
    });
    window.viajelistoInstalled = function () {
      return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    };
    window.viajelistoCanInstall = function () {
      return !!window.viajelistoInstallPrompt;
    };
    window.viajelistoInstall = async function () {
      var promptEvent = window.viajelistoInstallPrompt;
      if (!promptEvent) return 'manual';
      promptEvent.prompt();
      var choice = await promptEvent.userChoice;
      window.viajelistoInstallPrompt = null;
      return choice && choice.outcome ? choice.outcome : 'dismissed';
    };
    window.viajelistoAskNotify = async function () {
      if (!('Notification' in window)) return 'unsupported';
      try {
        return await Notification.requestPermission();
      } catch (error) {
        return 'denied';
      }
    };
    window.viajelistoNotify = function (title, body) {
      if (!('Notification' in window) || Notification.permission !== 'granted') return false;
      try {
        new Notification(title, { body: body, icon: 'icons/Icon-192.png' });
        return true;
      } catch (error) {
        return false;
      }
    };
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
